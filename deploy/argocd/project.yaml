apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: kestrel
  namespace: argocd
spec:
  description: Kestrel Air production services
  sourceRepos:
    - https://github.com/roykaushik07/kestrel-platform.git
  destinations:
    - namespace: "kestrel-*"
      name: in-cluster
  clusterResourceWhitelist:
    - group: ""
      kind: Namespace
  namespaceResourceWhitelist:
    - group: "*"
      kind: "*"
