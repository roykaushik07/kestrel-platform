apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: kestrel-services
  namespace: argocd
spec:
  generators:
    - list:
        elements:
          - service: gateway
          - service: dispatch
          - service: telemetry
          - service: compliance
  template:
    metadata:
      name: "kestrel-{{service}}"
    spec:
      project: kestrel
      source:
        repoURL: https://github.com/roykaushik07/kestrel-platform.git
        targetRevision: main
        path: deploy/helm/kestrel-service
        helm:
          valueFiles:
            - "../values/kestrel-{{service}}/values.yaml"
      destination:
        name: in-cluster
        namespace: "kestrel-{{service}}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
