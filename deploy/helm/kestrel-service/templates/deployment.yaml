apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "kestrel-service.name" . }}
  labels:
    {{- include "kestrel-service.labels" . | nindent 4 }}
spec:
  {{- if not .Values.autoscaling.enabled }}
  replicas: {{ .Values.replicaCount }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "kestrel-service.selectorLabels" . | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "kestrel-service.selectorLabels" . | nindent 8 }}
    spec:
      serviceAccountName: {{ include "kestrel-service.name" . }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: {{ .Values.containerPort }}
          env:
            {{- range $k, $v := .Values.env }}
            - name: {{ $k }}
              value: {{ $v | quote }}
            {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
