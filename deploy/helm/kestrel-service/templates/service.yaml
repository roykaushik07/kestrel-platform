apiVersion: v1
kind: Service
metadata:
  name: {{ include "kestrel-service.name" . }}
  labels:
    {{- include "kestrel-service.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "kestrel-service.selectorLabels" . | nindent 4 }}
  ports:
    - name: http
      port: 80
      targetPort: http
