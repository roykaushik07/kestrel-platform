image:
  repository: ghcr.io/roykaushik07/kestrel-compliance
  tag: "1.5.0"

replicaCount: 2
containerPort: 8080

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::381492650173:role/kestrel-compliance
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    memory: 512Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 4
  targetCPUUtilizationPercentage: 70

env:
  LOG_LEVEL: info
  AWS_REGION: eu-west-1
