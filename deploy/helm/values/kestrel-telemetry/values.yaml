image:
  repository: ghcr.io/roykaushik07/kestrel-telemetry
  tag: "0.11.4"

replicaCount: 2
containerPort: 8080

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::381492650173:role/kestrel-telemetry
resources:
  requests:
    cpu: 1
    memory: 1Gi
  limits:
    memory: 1Gi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

env:
  LOG_LEVEL: info
  AWS_REGION: eu-west-1
