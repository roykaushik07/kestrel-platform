image:
  repository: ghcr.io/roykaushik07/kestrel-dispatch
  tag: "2.3.1"

replicaCount: 2
containerPort: 8080

serviceAccount:
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::381492650173:role/kestrel-dispatch
resources:
  requests:
    cpu: 500m
    memory: 768Mi
  limits:
    memory: 768Mi

autoscaling:
  enabled: true
  minReplicas: 2
  maxReplicas: 8
  targetCPUUtilizationPercentage: 70

env:
  LOG_LEVEL: info
  AWS_REGION: eu-west-1
